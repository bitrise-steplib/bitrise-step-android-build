format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:

  test_nested_module:
    title: Test simple Android project with nested application module
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - BRANCH: maintenance
    - EXPECTED_APK: nested_app-release-unsigned.apk
    - EXPECTED_MAPPING: app-mapping.txt
    - JDK_VERSION: "17"
    before_run:
    - _setup
    after_run:
    - _check_apk
    - _check_mapping
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test nested module
        inputs:
        - module: app:nested_app
        - variant: release

  test_multiple_variants:
    title: Test building multiple variants
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - BRANCH: maintenance
    - EXPECTED_APK: another_app-full-release-unsigned.apk
    - EXPECTED_APK_PATH_LIST: $BITRISE_DEPLOY_DIR/another_app-demo-release-unsigned.apk|$BITRISE_DEPLOY_DIR/another_app-full-release-unsigned.apk
    - EXPECTED_MAPPING: another_app-mapping.txt
    - JDK_VERSION: "17"
    before_run:
    - _setup
    after_run:
    - _check_apk
    - _check_mapping
    # multiple variants with mappings is the artifact map's flagship scenario
    - _check_artifact_map
    - _check_distinct_variant_mappings
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Execute step
        inputs:
        - module: another_app
        - variant: |-
            fullRelease
            demoRelease
    - script:
        title: Clean up this workflow's APKs before the compatibility-mode run
        inputs:
        - content: |-
            set -ex

            # only this workflow's own artifacts: the deploy dir is shared with
            # the other e2e workflows, and the artifact map they merged into
            # still references theirs
            rm -fv $BITRISE_DEPLOY_DIR/another_app-*.apk
    - path::./:
        title: Execute step (compatibility mode)
        description: The step used to split multiple variants by the "\n" substring instead of a literal line break
        inputs:
        - module: another_app
        - variant: fullRelease\ndemoRelease

  test_merged_apk_and_aab:
    title: Two step runs (apk then aab) merge into one artifact map
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - BRANCH: maintenance
    - JDK_VERSION: "17"
    before_run:
    - _setup
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: First run (apk)
        inputs:
        - module: another_app
        - variant: DemoRelease
        - build_type: apk
    - path::./:
        title: Second run (aab)
        inputs:
        - module: another_app
        - variant: DemoRelease
        - build_type: aab
    - script:
        title: Check the merged artifact map pairs both artifact types
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            echo "--- artifact map ---"
            cat "$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--------------------"
            entry='.modules.another_app.demoRelease'
            jq -e "$entry.apk | length > 0" "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "expected the first run's APK in the merged map"; exit 1; }
            jq -e "$entry.aab | length > 0" "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "expected the second run's AAB in the merged map"; exit 1; }
            jq -e "$entry.mapping != null and $entry.mapping != \"\"" "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "expected the variant's mapping in the merged map"; exit 1; }
            echo "merged artifact map pairs apk, aab and mapping for another_app/demoRelease"

  test_simple_apk:
    title: Test simple Android project and APK building
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - BRANCH: maintenance
    - EXPECTED_APK: another_app-demo-release-unsigned.apk
    - EXPECTED_MAPPING: another_app-mapping.txt
    - JDK_VERSION: "17"
    before_run:
    - _setup
    after_run:
    - _check_apk
    - _check_mapping
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test simple android project
        inputs:
        - module: another_app
        - variant: DemoRelease
        - arguments: --warn

  test_monorepo_apk:
    title: Test multiple separate projects in a monorepo and APK building
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-testing.git
    - BRANCH: maintenance
    - EXPECTED_APK: IdlingResourceSample-app-debug.apk
    - JDK_VERSION: "11"
    before_run:
    - _setup
    after_run:
    - _check_apk
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ui/espresso/IdlingResourceSample/gradlew
    - path::./:
        title: Test monorepo
        inputs:
        - project_location: ui/espresso/IdlingResourceSample
        - variant: Debug

  test_simple_aab:
    title: Test simple Android project and AAB building
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-multiple-test-results-sample.git
    - BRANCH: maintenance
    - EXPECTED_AAB: another_app-demo-release.aab
    - EXPECTED_MAPPING: another_app-mapping.txt
    - JDK_VERSION: "17"
    before_run:
    - _setup
    after_run:
    - _check_aab
    - _check_mapping
    - _check_artifact_map
    steps:
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test simple android project
        inputs:
        - module: another_app
        - variant: DemoRelease
        - build_type: aab

  test_monorepo_aab:
    title: Test multiple separate projects in a monorepo and AAB building
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/android-testing.git
    - BRANCH: maintenance
    - EXPECTED_AAB: IdlingResourceSample-app-debug.aab
    - JDK_VERSION: "11"
    before_run:
    - _setup
    after_run:
    - _check_aab
    steps:
    - change-workdir:
        title: cd ./ui/espresso/IdlingResourceSample
        inputs:
        - path: ./ui/espresso/IdlingResourceSample
        - is_create_path: true
    - install-missing-android-tools:
        inputs:
        - gradlew_path: ./gradlew
    - path::./:
        title: Test monorepo
        inputs:
        - variant: Debug
        - build_type: aab

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: .
        - branch: $BRANCH
    - set-java-version@1:
        run_if: $.IsCI
        inputs:
        - set_java_version: $JDK_VERSION

  _check_apk:
    steps:
    - script:
        title: Check exported APK
        inputs:
        - content: |-
            #!/usr/bin/env bash

            echo "BITRISE_APK_PATH: $BITRISE_APK_PATH"
            echo "BITRISE_APK_PATH_LIST: $BITRISE_APK_PATH_LIST"

            if [ -z "$BITRISE_APK_PATH" ] ; then echo "BITRISE_APK_PATH env is empty" ; exit 1 ; fi ;
            if [ -z "$BITRISE_APK_PATH_LIST" ] ; then echo "BITRISE_APK_PATH_LIST env is empty" ; exit 1 ; fi ;

            if [ ! -f "$BITRISE_DEPLOY_DIR/$EXPECTED_APK" ] ; then
              echo "Expected APK ($EXPECTED_APK) is not found in deploy dir:"
              ls -la $BITRISE_DEPLOY_DIR
              exit 1
            fi

            if [ -n "$EXPECTED_APK_PATH_LIST" ] ; then
              if [ "$EXPECTED_APK_PATH_LIST" != "$BITRISE_APK_PATH_LIST" ] ; then
                echo "Expected APK path list does not match actual step output"
                echo "Expected: $EXPECTED_APK_PATH_LIST"
                echo "Actual: $BITRISE_APK_PATH_LIST"
                exit 1
              fi
            fi

  _check_aab:
    steps:
    - script:
        title: Check exported AAB
        inputs:
        - content: |-
            #!/usr/bin/env bash

            echo "BITRISE_AAB_PATH: $BITRISE_AAB_PATH"
            echo "BITRISE_AAB_PATH_LIST: $BITRISE_AAB_PATH_LIST"

            if [ -z "$BITRISE_AAB_PATH" ] ; then echo "BITRISE_AAB_PATH env is empty" ; exit 1 ; fi ;
            if [ -z "$BITRISE_AAB_PATH_LIST" ] ; then echo "BITRISE_AAB_PATH_LIST env is empty" ; exit 1 ; fi ;

            if [ ! -f "$BITRISE_DEPLOY_DIR/$EXPECTED_AAB" ] ; then
              echo "Expected AAB ($EXPECTED_AAB) is not found in deploy dir:"
              ls -la $BITRISE_DEPLOY_DIR
              exit 1
            fi

  _check_mapping:
    steps:
    - script:
        title: Check exported mapping.txt
        inputs:
        - content: |-
            #!/usr/bin/env bash

            echo "BITRISE_MAPPING_PATH: $BITRISE_MAPPING_PATH"

            if [ -z "$BITRISE_MAPPING_PATH" ] ; then echo "BITRISE_MAPPING_PATH env is empty" ; exit 1 ; fi ;

            if [ ! -f "$BITRISE_DEPLOY_DIR/$EXPECTED_MAPPING" ] ; then
              echo "Expected mapping file ($EXPECTED_MAPPING) is not found in deploy dir:"
              ls -la $BITRISE_DEPLOY_DIR
              exit 1
            fi

  # Every variant of a module gets its OWN mapping file: both variants' mapping
  # is named mapping.txt in the build tree, so they collide in the flat deploy
  # dir — and the disambiguating suffix used to have second resolution, which
  # let one copy overwrite the other and left both variants pointing at the
  # survivor. Only attach to workflows that build several minified variants.
  _check_distinct_variant_mappings:
    steps:
    - script:
        title: Check each variant kept its own mapping file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            mappings=$(jq -r '[.modules[][] | .mapping // empty]' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH") \
              || { echo "failed to list the artifact map's mappings"; exit 1; }
            echo "variant mappings: $mappings"
            total=$(jq -r 'length' <<< "$mappings")
            unique=$(jq -r 'unique | length' <<< "$mappings")
            if [ "$total" -lt 2 ]; then
              echo "expected at least two variants with a mapping, got $total"
              exit 1
            fi
            if [ "$total" != "$unique" ]; then
              echo "two variants share a mapping file: one overwrote the other in the deploy dir"
              exit 1
            fi
            echo "all $total variant mappings are distinct files"

  # NOTE: this helper asserts `.modules` is non-empty, so only attach it to
  # workflows whose build produces variant-attributable artifacts (the standard
  # build/outputs/{apk,bundle,mapping} layout). A map with only `unmatched`
  # entries is contract-conformant but would fail this check.
  _check_artifact_map:
    steps:
    - script:
        title: Check the variant-keyed artifact map output
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            if [ -z "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" ]; then
              echo "BITRISE_ANDROID_ARTIFACT_MAP_PATH env is empty"
              exit 1
            fi
            if [ ! -f "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" ]; then
              echo "Artifact map not found at '${BITRISE_ANDROID_ARTIFACT_MAP_PATH}'"
              exit 1
            fi
            echo "--- artifact map ---"
            cat "$BITRISE_ANDROID_ARTIFACT_MAP_PATH"
            echo "--------------------"

            jq -e '.version == 1' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "artifact map schema version is not 1"; exit 1; }
            jq -e '[.modules[][]] | length > 0' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH" > /dev/null \
              || { echo "artifact map has no variants"; exit 1; }

            # Every file the map references — variant entries AND unmatched —
            # must exist next to the map file. jq runs first so its failure
            # fails the check (a process substitution's exit code would be
            # swallowed), with // [] guards against absent list fields.
            # read -r keeps file names with spaces intact.
            refs=$(jq -r '(.modules[][] | (.mapping // empty), (.apk // [])[], (.aab // [])[], (.aar // [])[]), (.unmatched | (.apk // [])[], (.aab // [])[], (.aar // [])[], (.mapping // [])[])' "$BITRISE_ANDROID_ARTIFACT_MAP_PATH") \
              || { echo "failed to list the artifact map's file references"; exit 1; }
            map_dir=$(dirname "$BITRISE_ANDROID_ARTIFACT_MAP_PATH")
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if [ ! -f "$map_dir/$name" ]; then
                echo "artifact map references '$name' but it does not exist in $map_dir"
                exit 1
              fi
              echo "artifact map entry exists: $name"
            done <<< "$refs"
