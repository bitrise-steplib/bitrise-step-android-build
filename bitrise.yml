format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

workflows:
  sample:
    steps:
    - git-clone:
        inputs:
        - repository_url: https://github.com/bitrise-io/Bitrise-Android-Sample.git
        - clone_into_dir: ./_tmp
        - branch: main
    - path::./:
        title: Execute step
        inputs:
        - project_location: ./_tmp
        - variant: debug
        - app_type: aab

  # check: included from steps-check/steps.bitrise.yml

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
        inputs:
        - example_section: docs/examples.md
